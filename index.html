</script><script>'use strict';
const AXES = ['新鲜事物','社交距离','行动节奏','生活习惯','情绪表达'];

const KEY = 'pet-gallery-observations-v1';
const app = document.querySelector('#app');

function remember() {
  try { localStorage.setItem(KEY, JSON.stringify({answers,current})); } catch {}
}
function restore() {
  try {
    const state = JSON.parse(localStorage.getItem(KEY));
    if (state && Array.isArray(state.answers) && state.answers.length <= QUESTIONS.length &&
      state.answers.every(n => Number.isInteger(n) && n >= 0 && n <= 3) &&
      Number.isInteger(state.current) && state.current >= 0 && state.current <= state.answers.length) {
      answers = state.answers; current = state.current;
    }
  } catch {}
}
function score(values) {
  const totals = AXES.map(()=>0), counts = AXES.map(()=>0);
  values.forEach((n,i)=>{const axis=QUESTIONS[i].axis; totals[axis]+=WEIGHTS[n]; counts[axis]++;});
  const means=totals.map((v,i)=>v/counts[i]);
  const distance=p=>p.target.reduce((sum,v,i)=>sum+(v-means[i])**2,0);
  // Equal distances retain catalogue order. Scores are recomputed from the complete answer list.
  const profile=PROFILES.reduce((best,p)=>distance(p)<distance(best)?p:best);
  return {means,profile};
}

function evidence(profile,means){

  candidates.sort((a,b)=>Math.abs(means[b.q.axis])*Math.abs(b.w)-Math.abs(means[a.q.axis])*Math.abs(a.w));

}

  app.querySelector('h2').textContent=p.name;app.querySelector('.bio').textContent=p.role+' · '+p.years;
  app.querySelector('.quote').textContent=p.line;app.querySelector('.traits').textContent=p.tags.join('　/　');
  const parts=[['匹配理由',p.reason],['隐藏优势',p.strength],['趣味彩蛋',p.egg]];
  const clue=evidence(p,means);
  parts.forEach(([title,text],i)=>{const h=document.createElement('h3'),body=document.createElement('p');
    h.textContent=title;body.textContent=text;const detail=app.querySelector('.detail');detail.append(h,body);
    if(!i){const ev=document.createElement('p');ev.className='evidence';ev.textContent=clue;detail.append(ev);}
  });
  app.querySelector('#again').onclick=()=>{answers=[];current=0;remember();ask();};
  const share=app.querySelector('#share'),area=app.querySelector('#posterArea');
  const panel=document.createElement('section');
  panel.className='photo-panel';
  panel.innerHTML='<h3>给这幅画像换上它的照片</h3><p>选一张你喜欢的照片，放在分享长图最上方。照片仅在本机处理。</p><div class="photo-buttons"><button class="secondary" id="choosePhoto">选择宠物照片</button><button class="back" id="removePhoto" hidden>移除照片</button></div><input type="file" accept="image/*" hidden><div class="photo-preview"></div><p class="photo-status" role="status"></p>';
  app.querySelector('.actions').before(panel);
  const picker=panel.querySelector('input'),choose=panel.querySelector('#choosePhoto');
  const remove=panel.querySelector('#removePhoto'),preview=panel.querySelector('.photo-preview');
  const status=panel.querySelector('.photo-status');
  let photo=null;
  function setPhoto(image){
    photo=image;preview.replaceChildren();
    if(image)preview.append(image);
    choose.textContent=image?'更换照片':'选择宠物照片';remove.hidden=!image;
    area.replaceChildren();share.textContent='生成分享长图';share.disabled=false;
    status.textContent=image?'已选好，生成长图即可保存。':'';
  }
  choose.onclick=()=>picker.click();
  remove.onclick=()=>setPhoto(null);
  picker.onchange=async()=>{
    const file=picker.files[0];picker.value='';if(!file)return;
    const previouslyDisabled=share.disabled;
    choose.disabled=remove.disabled=share.disabled=true;
    status.textContent='正在准备照片…';
    try {setPhoto(await preparePhoto(file));}
    catch{
      share.disabled=previouslyDisabled;
      status.textContent='这张照片暂时读不出来，请换一张 JPG、PNG 或 WebP 图片。';
    } finally {choose.disabled=remove.disabled=false;}
  };
  share.onclick=async function(){
    this.disabled=choose.disabled=remove.disabled=true;
    try{
      const nodes=await poster(p,parts,clue,photo);
      if(!area.isConnected)return;
      area.replaceChildren(...nodes);area.scrollIntoView({block:'start'});this.textContent='分享长图已生成';
    }
    catch{this.disabled=false;area.textContent='图片暂时无法生成，可以直接截取上方画像。';}
    finally{choose.disabled=remove.disabled=false;}
  };
  focusTitle();
}
async function preparePhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const source=new Image();source.src=url;await source.decode();
    // Downsample locally so that preview and poster share one small, correctly oriented bitmap.
    const scale=Math.min(1,1000/Math.max(source.naturalWidth,source.naturalHeight));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(source.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(source.naturalHeight*scale));
    const context=canvas.getContext('2d');
    context.fillStyle='#f6f2e8';context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(source,0,0,canvas.width,canvas.height);
    const image=new Image();image.alt='已选的宠物照片';image.src=canvas.toDataURL('image/jpeg',0.91);
    await image.decode();return image;
  } finally {URL.revokeObjectURL(url);}
}
async function poster(p,parts,clue,photo){
  const canvas=document.createElement('canvas'),c=canvas.getContext('2d'),width=800;
  const img=photo || new Image();
  if(!photo){img.src=art;await img.decode();}
  const scale=Math.min(696/img.naturalWidth,720/img.naturalHeight);
  const photoWidth=img.naturalWidth*scale,photoHeight=img.naturalHeight*scale;
  const photoSpace=photo?Math.ceil(photoHeight)+38:0;
  const lines=[];
  function add(text,size,bold=false,color='#243d32',gap=12){
    const font=(bold?'bold ':'')+size+'px "Microsoft YaHei",sans-serif';
    c.font=font;let buf='';
    for(const ch of text){if(buf && c.measureText(buf+ch).width>684){lines.push({buf,font,color,h:size*1.55});buf='';}buf+=ch;}
    lines.push({buf,font,color,h:size*1.55+gap});
  }
  add(p.line,34,true);add(p.tags.join('  /  '),25,false,'#755831',24);
  for(const [title,copy] of parts){add(title,28,true);add(copy,25);if(title==='匹配理由')add(clue,23,false,'#526253',16);}
  canvas.width=width;canvas.height=Math.ceil(335+photoSpace+lines.reduce((s,x)=>s+x.h,0)+85);
  c.fillStyle='#f6f2e8';c.fillRect(0,0,width,canvas.height);c.fillStyle='#173c32';c.fillRect(0,0,width,285+photoSpace);
  c.strokeStyle='#b59a66';c.lineWidth=2;
  if(photo){
    const x=(width-photoWidth)/2;
    c.drawImage(img,x,262,photoWidth,photoHeight);c.strokeRect(x-3,259,photoWidth+6,photoHeight+6);
  }else{
    c.drawImage(img,555,42,190,190);c.strokeRect(550,37,200,200);
  }
  c.textBaseline='top';c.fillStyle='#dacba4';c.font='24px sans-serif';c.fillText('宠物肖像馆  /  历史人物画像',48,50);
  c.fillStyle='#fff7e6';c.font='bold 53px serif';c.fillText(p.name,48,110,photo?696:482);
  c.font='22px sans-serif';c.fillText(p.role+' · '+p.years,48,200,480);
  let y=323+photoSpace;for(const l of lines){c.font=l.font;c.fillStyle=l.color;c.fillText(l.buf,52,y);y+=l.h;}
  c.font='22px sans-serif';c.fillStyle='#5a665b';c.fillText('测测你的宠物对应哪位历史大佬',52,canvas.height-55);
  const src=canvas.toDataURL('image/png'),picture=new Image();picture.src=src;picture.className='poster';picture.alt='宠物历史人物匹配结果长图';
  const a=document.createElement('a');a.href=src;a.download='宠物肖像馆-'+p.name+'.png';a.textContent='下载图片（手机也可长按保存）';
  return [picture,a];
}
restore();home();
